<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 342" width="240" height="342"
     role="img" aria-label="Grand Theft Auto: Vice City">
  <!--
    Original artwork, not a reproduction of the retail cover: a Miami sunset built from the vice
    brand tokens, so the shelf reads as one designed set rather than a row of scanned boxes.
    Flat vectors only — this sits on a 3D-transformed face, where gradients stay crisp and
    photographs do not.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1035"/>
      <stop offset="42%" stop-color="#5c1c63"/>
      <stop offset="70%" stop-color="#c02f7a"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="55%" stop-color="#ff5fa2"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1150"/>
      <stop offset="100%" stop-color="#0d0722"/>
    </linearGradient>
    <!-- The sun is banded by the horizon lines, the way the era's artwork always did it. -->
    <clipPath id="sunClip"><circle cx="120" cy="196" r="54"/></clipPath>
  </defs>

  <rect width="240" height="342" fill="url(#sky)"/>

  <circle cx="120" cy="196" r="54" fill="url(#sun)"/>
  <g clip-path="url(#sunClip)" fill="#1b1035" opacity="0.55">
    <rect x="60" y="196" width="120" height="4"/>
    <rect x="60" y="207" width="120" height="6"/>
    <rect x="60" y="221" width="120" height="8"/>
    <rect x="60" y="238" width="120" height="12"/>
  </g>

  <!-- Skyline: rectangles only, silhouetted so it reads at box size. -->
  <g fill="#150c2e">
    <rect x="0" y="182" width="18" height="60"/>
    <rect x="20" y="166" width="13" height="76"/>
    <rect x="35" y="196" width="16" height="46"/>
    <rect x="53" y="150" width="15" height="92"/>
    <rect x="70" y="188" width="12" height="54"/>
    <rect x="158" y="192" width="14" height="50"/>
    <rect x="174" y="158" width="16" height="84"/>
    <rect x="192" y="200" width="12" height="42"/>
    <rect x="206" y="172" width="15" height="70"/>
    <rect x="223" y="190" width="17" height="52"/>
  </g>
  <!-- Lit windows, sparse enough to stay legible at 240px. -->
  <g fill="#ffb3d9" opacity="0.75">
    <rect x="24" y="176" width="2" height="3"/><rect x="28" y="184" width="2" height="3"/>
    <rect x="57" y="160" width="2" height="3"/><rect x="61" y="172" width="2" height="3"/>
    <rect x="57" y="188" width="2" height="3"/><rect x="178" y="168" width="2" height="3"/>
    <rect x="183" y="180" width="2" height="3"/><rect x="210" y="182" width="2" height="3"/>
  </g>

  <rect x="0" y="242" width="240" height="100" fill="url(#sea)"/>
  <!-- Reflection: the sun's column on the water, thinning as it recedes. -->
  <g fill="#ff5fa2" opacity="0.5">
    <rect x="104" y="246" width="32" height="3"/>
    <rect x="108" y="253" width="24" height="2"/>
    <rect x="102" y="259" width="36" height="2"/>
    <rect x="110" y="266" width="20" height="2"/>
    <rect x="106" y="273" width="28" height="2"/>
  </g>

  <!-- Palms, framing the wordmark left and right. -->
  <g fill="#0d0722">
    <path d="M30 342V276c0-6 2-9 4-11 -6-3-13-1-17 4 3-8 11-11 18-8 -3-7-1-14 5-18 -2 7 0 13 5 17 4-6 12-8 18-4 -7 1-12 6-13 12 3-1 6 1 6 5v69z"/>
    <path d="M206 342V282c0-5 2-8 4-10 -5-3-11-1-15 3 3-7 10-9 16-7 -3-6-1-12 4-16 -2 6 0 11 4 15 4-5 11-7 16-3 -6 1-10 5-11 10 3-1 5 1 5 4v64z"/>
  </g>

  <!-- Wordmark. Kept to system faces: this ships as a static asset with no font to load. -->
  <text x="120" y="70" text-anchor="middle" fill="#ff2d95"
        font-family="Impact, 'Haettenschweiler', 'Arial Narrow Bold', sans-serif"
        font-size="46" letter-spacing="1">VICE</text>
  <text x="120" y="112" text-anchor="middle" fill="#4ee2ec"
        font-family="Impact, 'Haettenschweiler', 'Arial Narrow Bold', sans-serif"
        font-size="46" letter-spacing="1">CITY</text>
  <text x="120" y="34" text-anchor="middle" fill="#f2e9ff" opacity="0.85"
        font-family="'Courier New', ui-monospace, monospace" font-size="11" letter-spacing="3">GRAND THEFT AUTO</text>

  <text x="120" y="330" text-anchor="middle" fill="#f2e9ff" opacity="0.6"
        font-family="'Courier New', ui-monospace, monospace" font-size="9" letter-spacing="2">WEBASSEMBLY</text>
</svg>
